version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: alphahunter_pg
    environment:
      POSTGRES_USER: ${DB_USER:-alphahunter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alpha123}
      POSTGRES_DB: ${DB_NAME:-alphahunter_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphahunter -d alphahunter_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alphahunter_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: alphahunter_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./apps/backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: alphahunter_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend
    volumes:
      - ./apps/frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  redisdata:
