name: AlphaHunter CI

on:
  push:
    branches:
      - main
    paths:
      - "alphahunter/**"
      - ".github/workflows/alphahunter-ci.yml"
  pull_request:
    paths:
      - "alphahunter/**"
      - ".github/workflows/alphahunter-ci.yml"

jobs:
  # ── Backend: lint + test + coverage ──────────────────────────────────────────
  backend-tests:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alphahunter/apps/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: alphahunter/apps/backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run backend tests with coverage
        env:
          APP_ENV: development
          DATABASE_URL: "sqlite:///./test_alphahunter.db"
          GEMINI_API_KEY: ""
          MINO_API_KEY: ""
          REDIS_URL: ""
        run: |
          pytest -v --cov=. --cov-report=term-missing --cov-fail-under=40

      - name: Check for hardcoded secrets
        run: |
          if grep -rn "sk-\|AIza\|eyJhbGci" --include="*.py" .; then
            echo "Possible hardcoded API key detected!" && exit 1
          fi

  # ── Frontend: test + build ────────────────────────────────────────────────────
  frontend:
    name: Frontend tests + build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alphahunter/apps/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: alphahunter/apps/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  # ── Security: dependency audit ────────────────────────────────────────────────
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for audit
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit frontend dependencies
        working-directory: alphahunter/apps/frontend
        run: npm audit --audit-level=high || true  # warn but don't fail CI on audit

      - name: Set up Python for pip-audit
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python dependencies
        working-directory: alphahunter/apps/backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969 || true
